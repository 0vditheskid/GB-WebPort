<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Gang Beasts</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=720></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-text">0%</div>
      </div>
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
      <div id="toolbar">
        <button id="settings-toggle" aria-label="Toggle settings">
          <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg>
        </button>
        <div id="settings-panel">
          <select id="quality-select" title="Render quality">
            <option value="1">Full</option>
            <option value="0.75">Balanced</option>
            <option value="0.5">Performance</option>
            <option value="0.25">Fastest</option>
          </select>
          <label><input type="checkbox" id="fps-checkbox"> FPS</label>
        </div>
      </div>
      <img id="credit" src="StreamingAssets/port-credit.webp" alt="">
      <div id="controls-menu">
        <div class="cm-panel">
          <div class="cm-title">Controls</div>
          <div class="cm-grid">
            <div class="cm-section">
              <h3>Movement</h3>
              <div class="cm-row"><span>Move</span><span><i class="key">W</i><i class="key">A</i><i class="key">S</i><i class="key">D</i></span></div>
              <div class="cm-row"><span>Run</span><span>Space + move</span></div>
              <div class="cm-row"><span>Crouch</span><span><i class="key wide">Ctrl</i></span></div>
              <div class="cm-row"><span>Sit</span><span><i class="key wide">Ctrl</i> still</span></div>
              <div class="cm-row"><span>Lie down</span><span><i class="key wide">Ctrl</i> moving</span></div>
            </div>
            <div class="cm-section">
              <h3>Actions</h3>
              <div class="cm-row"><span>Jump</span><span><i class="key wide">Space</i></span></div>
              <div class="cm-row"><span>Lift / Grab</span><span><i class="key wide">Shift</i></span></div>
              <div class="cm-row"><span>Kick</span><span><i class="key">M</i></span></div>
              <div class="cm-row"><span>Headbutt</span><span><i class="key wide">RMB</i> or <i class="key">.</i></span></div>
              <div class="cm-row"><span>Taunt</span><span><i class="key wide">Shift</i> (empty hands)</span></div>
            </div>
          </div>
          <div class="cm-footer">
            <span>Hold H for 2 seconds to close</span>
            <button id="controls-close">Got it!</button>
          </div>
        </div>
      </div>
      <div id="fps-counter"></div>
      <button id="menu-button" data-key="esc" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="touch-controls">
        <div id="joystick">
          <div id="joystick-knob"></div>
        </div>
        <div class="touch-actions">
          <button data-key="ctrl">Ctrl</button>
          <button data-key="m">M</button>
          <button data-key="shift">Shift</button>
          <button data-key="comma" class="hold-icon" aria-label="Punch / grab">
            <svg class="icon-punch" viewBox="0 0 24 24"><path d="M7 11V7a2 2 0 0 1 4 0v3M11 10V6a2 2 0 0 1 4 0v4M15 10V7a2 2 0 0 1 4 0v6a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-1.9L7 13"/></svg>
            <svg class="icon-grab" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
          </button>
          <button data-key="space">Space</button>
          <button data-key="period" aria-label="Headbutt">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
          </button>
          <button data-key="q">Q</button>
          <button data-key="left">&#8592;</button>
          <button data-key="right">&#8594;</button>
        </div>
      </div>
      <div id="promo">
        <img src="StreamingAssets/Blue-Graffiti-Doodle-Poster.png" alt="">
      </div>
      <div id="support-popup">
        <div class="sp-panel">
          <svg class="sp-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.1C1.1 8.6 3 5 6.5 5c2.1 0 3.5 1.2 4.5 2.6C12 6.2 13.4 5 15.5 5 19 5 20.9 8.6 21.5 11.9 19.5 16.4 12 21 12 21z"/></svg>
          <p>Please Do This To Support Me</p>
          <div class="sp-actions">
            <a class="sp-button" href="confirm.html">Support</a>
            <button id="support-later" type="button">Not now</button>
          </div>
        </div>
      </div>
    </div>
    <script src="game-data.js"></script>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLValidation.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGLValidation.data",
        frameworkUrl: buildUrl + "/WebGLValidation.framework.js",
        codeUrl: buildUrl + "/WebGLValidation.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Boneloaf",
        productName: "Gang Beasts",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var mobileWarning = document.querySelector("#unity-mobile-warning");
      var promo = document.querySelector("#promo");
      var qualitySelect = document.querySelector("#quality-select");
      var renderScale = Number(localStorage.getItem("renderScale") || 0.5);

      qualitySelect.value = String(renderScale);
      var toolbar = document.querySelector("#toolbar");
      var fpsCheckbox = document.querySelector("#fps-checkbox");
      var controlsMenu = document.querySelector("#controls-menu");
      var helpHoldTimer = null;
      document.addEventListener("keydown", (event) => {
        if (event.code !== "KeyH" || event.repeat || helpHoldTimer) return;
        helpHoldTimer = setTimeout(() => {
          helpHoldTimer = null;
          controlsMenu.classList.toggle("visible");
        }, 2000);
      });
      document.addEventListener("keyup", (event) => {
        if (event.code !== "KeyH") return;
        clearTimeout(helpHoldTimer);
        helpHoldTimer = null;
      });
      controlsMenu.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });
      document.querySelector("#controls-close").addEventListener("click", () => {
        controlsMenu.classList.remove("visible");
      });
      var settingsPanel = document.querySelector("#settings-panel");
      document.querySelector("#settings-toggle").addEventListener("click", () => {
        settingsPanel.style.display = settingsPanel.style.display === "none" ? "" : "none";
      });
      var fpsCounter = document.querySelector("#fps-counter");
      var progressText = document.querySelector("#unity-loading-text");

      toolbar.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });
      fpsCheckbox.addEventListener("change", () => {
        fpsCounter.style.display = fpsCheckbox.checked ? "block" : "none";
      });

      var KEYS = {
        w: { key: "w", code: "KeyW", keyCode: 87 },
        a: { key: "a", code: "KeyA", keyCode: 65 },
        s: { key: "s", code: "KeyS", keyCode: 83 },
        d: { key: "d", code: "KeyD", keyCode: 68 },
        m: { key: "m", code: "KeyM", keyCode: 77 },
        space: { key: " ", code: "Space", keyCode: 32 },
        ctrl: { key: "Control", code: "ControlLeft", keyCode: 17 },
        shift: { key: "Shift", code: "ShiftLeft", keyCode: 16 },
        comma: { key: ",", code: "Comma", keyCode: 188 },
        period: { key: ".", code: "Period", keyCode: 190 },
        q: { key: "q", code: "KeyQ", keyCode: 81 },
        left: { key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },
        right: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
        esc: { key: "Escape", code: "Escape", keyCode: 27 },
      };
      var sendKey = (type, keyInfo) => {
        var event = new KeyboardEvent(type, { key: keyInfo.key, code: keyInfo.code, bubbles: true, cancelable: true });
        Object.defineProperty(event, "keyCode", { get: () => keyInfo.keyCode });
        Object.defineProperty(event, "which", { get: () => keyInfo.keyCode });
        canvas.dispatchEvent(event);
      };

      var touchControls = document.querySelector("#touch-controls");
      if (matchMedia("(pointer: coarse)").matches) {
        touchControls.classList.add("enabled");
      }
      document.querySelectorAll("[data-key]").forEach((button) => {
        var keyInfo = KEYS[button.dataset.key];
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          button.setPointerCapture(event.pointerId);
          button.classList.add("held");
          sendKey("keydown", keyInfo);
        });
        var release = (event) => {
          event.stopPropagation();
          button.classList.remove("held");
          if (button.hasPointerCapture(event.pointerId)) sendKey("keyup", keyInfo);
        };
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
      });
      var joystick = document.querySelector("#joystick");
      var joystickKnob = document.querySelector("#joystick-knob");
      var joystickPointer = null;
      var moveKeys = { w: false, a: false, s: false, d: false };
      var setMoveKey = (name, down) => {
        if (moveKeys[name] === down) return;
        moveKeys[name] = down;
        sendKey(down ? "keydown" : "keyup", KEYS[name]);
      };
      var updateJoystick = (event) => {
        var rect = joystick.getBoundingClientRect();
        var radius = rect.width / 2;
        var dx = event.clientX - (rect.left + radius);
        var dy = event.clientY - (rect.top + radius);
        var distance = Math.hypot(dx, dy);
        var limit = radius * 0.55;
        if (distance > limit) {
          dx *= limit / distance;
          dy *= limit / distance;
        }
        joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        var threshold = radius * 0.3;
        setMoveKey("w", dy < -threshold);
        setMoveKey("s", dy > threshold);
        setMoveKey("a", dx < -threshold);
        setMoveKey("d", dx > threshold);
      };
      var releaseJoystick = () => {
        joystickPointer = null;
        joystickKnob.style.transform = "";
        joystick.classList.remove("active");
        Object.keys(moveKeys).forEach((name) => setMoveKey(name, false));
      };
      joystick.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
        joystickPointer = event.pointerId;
        joystick.setPointerCapture(event.pointerId);
        joystick.classList.add("active");
        updateJoystick(event);
      });
      joystick.addEventListener("pointermove", (event) => {
        if (event.pointerId === joystickPointer) updateJoystick(event);
      });
      var endJoystick = (event) => {
        if (event.pointerId === joystickPointer) releaseJoystick();
      };
      joystick.addEventListener("pointerup", endJoystick);
      joystick.addEventListener("pointercancel", endJoystick);
      window.addEventListener("blur", () => {
        document.querySelectorAll("[data-key]").forEach((button) => {
          sendKey("keyup", KEYS[button.dataset.key]);
        });
        releaseJoystick();
      });

      var frames = 0;
      var lastFpsTime = performance.now();
      var countFrames = (now) => {
        frames++;
        if (now - lastFpsTime >= 1000) {
          fpsCounter.textContent = Math.round(frames * 1000 / (now - lastFpsTime)) + " FPS";
          frames = 0;
          lastFpsTime = now;
        }
        requestAnimationFrame(countFrames);
      };
      requestAnimationFrame(countFrames);

      var setProgress = (percent) => {
        progressBarFull.style.width = percent + "%";
        progressText.textContent = Math.round(percent) + "%";
      };
      qualitySelect.addEventListener("change", () => {
        localStorage.setItem("renderScale", qualitySelect.value);
        location.reload();
      });

      promo.addEventListener("click", () => {
        window.open("https://mixedness.space", "_blank", "noopener");
      });

      var supportPopup = document.querySelector("#support-popup");
      var SUPPORT_INTERVAL_MS = 48 * 60 * 60 * 1000;
      var supportLastShown = Number(localStorage.getItem("supportConfirmedAt") || 0);
      if (Date.now() - supportLastShown >= SUPPORT_INTERVAL_MS) {
        supportPopup.classList.add("visible");
      }
      supportPopup.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });
      document.querySelector("#support-later").addEventListener("click", () => {
        localStorage.setItem("supportConfirmedAt", String(Date.now()));
        supportPopup.classList.remove("visible");
      });

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        // Avoid draining fillrate performance on mobile devices,
        // and default/override low DPI mode on mobile browsers.
        config.devicePixelRatio = renderScale;
        mobileWarning.style.display = "block";
        setTimeout(() => {
          mobileWarning.style.display = "none";
        }, 5000);
      } else {
        config.devicePixelRatio = window.devicePixelRatio * renderScale;
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        var dataBlobUrl;
        try {
          dataBlobUrl = await loadGameData("Build/data-manifest.json", (progress) => {
            setProgress(80 * progress);
          });
          config.dataUrl = dataBlobUrl;
        await createUnityInstance(canvas, config, (progress) => {
          setProgress(80 + 20 * progress);
        }).then(() => {
          loadingBar.style.display = "none";
          document.addEventListener("pointerdown", () => {
            if (!document.fullscreenElement) container.requestFullscreen();
          });
          promo.classList.add("visible");
          setTimeout(() => promo.classList.remove("visible"), 4000);
        });
        } catch (error) {
          console.error(error);
          alert("No se pudo cargar el juego. Recarga para volver a intentarlo. " + error.message);
        } finally {
          if (dataBlobUrl) URL.revokeObjectURL(dataBlobUrl);
        }
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
